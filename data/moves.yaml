# The list of reference moves. Build them with:  python scripts/build_reference.py
# Paths are relative to this file.
#
#   name         unique id; becomes data/references/<name>.npz
#   pose_file    pose data for the source video:
#                  - Member A's output (.npz with `angles`, or `landmarks` + `layout`), preferred
#                  - an AIST++ keypoints2d/keypoints3d .pkl (for development only)
#   aist_view    camera index for AIST++ keypoints2d (0-8). Use the camera facing the dancer.
#   audio_file   optional video/audio with the music; enables music sync and beat-aware feedback.
#                .wav works out of the box; .mp4 needs FFmpeg on PATH or `pip install librosa`.
#   start_s, end_s   the move's window in the source video (keep moves to ~3-8 seconds)
#   mirror       true to flip left/right (e.g. to match a TikTok tutorial that's mirrored)
#
# Example entries. Check the exact file names in your AIST++ download before uncommenting.
moves: []
